<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0e14">
    <title>إنشاء حساب | متجر الشحن السعودي اليمني</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../static/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/custom.css">
    <link rel="stylesheet" href="../static/css/auth.css">
</head>

<body class="auth-page">
    <main class="auth-card wide">
        <button id="btnThemeToggle" type="button" class="theme-toggle" aria-label="تبديل الوضع الليلي/النهاري"></button>

        <div class="auth-logo">SY</div>
        <h1 class="auth-title">إنشاء حساب</h1>
        <p class="auth-sub">انضم إلينا وابدأ الشحن الفوري في أقل من دقيقة</p>

        <form action="" method="post" class="form" novalidate>
            <div class="row g-3">
                <div class="col-12 col-sm-6">
                    <label for="firstNameInput" class="form-label">الاسم الأول</label>
                    <input id="firstNameInput" name="first_name" type="text" class="form-control" placeholder="محمد"
                        autocomplete="given-name" required>
                </div>
                <div class="col-12 col-sm-6">
                    <label for="lastNameInput" class="form-label">الاسم الأخير</label>
                    <input id="lastNameInput" name="last_name" type="text" class="form-control" placeholder="المحمودي"
                        autocomplete="family-name" required>
                </div>
                <div class="col-12">
                    <label for="emailInput" class="form-label">البريد الإلكتروني</label>
                    <input id="emailInput" name="email" type="email" class="form-control" placeholder="name@example.com"
                        dir="ltr" autocomplete="email" required>
                </div>
                <div class="col-12">
                    <label for="phoneNumberInput" class="form-label">رقم الهاتف</label>
                    <input id="phoneNumberInput" name="phone" type="tel" class="form-control" placeholder="05XXXXXXXX"
                        dir="ltr" autocomplete="tel" required>
                </div>
                <div class="col-12 col-sm-6">
                    <label for="passwordInput" class="form-label">كلمة المرور</label>
                    <input id="passwordInput" name="password" type="password" class="form-control"
                        placeholder="••••••••" dir="ltr" autocomplete="new-password" required>
                </div>
                <div class="col-12 col-sm-6">
                    <label for="passwordConfirmInput" class="form-label">تأكيد كلمة المرور</label>
                    <input id="passwordConfirmInput" name="password_confirm" type="password" class="form-control"
                        placeholder="••••••••" dir="ltr" autocomplete="new-password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-brand w-100 mt-4">إنشاء حساب</button>

            <div class="auth-divider">أو</div>

            <p class="auth-foot mb-0">
                لديك حساب بالفعل؟
                <a href="login.html" class="auth-link">تسجيل الدخول</a>
            </p>

            <p class="auth-foot mt-3 mb-0">
                <a href="../index.html" class="auth-link" style="font-size:.78rem">← العودة إلى المتجر</a>
            </p>
        </form>
    </main>

    <script src="../static/js/bootstrap.min.js"></script>
    <script src="../static/js/auth.js"></script>
</body>

</html>
